[tool.poetry]
name = "homework"
version = "0.1.0"
description = ""
authors = ["ioy <andrey_zhu_kov@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"

[tool.black]
line-length = 119
exclude = ".git"          # в корне проекта

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exclude = [
".git", "venv"
]

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.17.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
